[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
solc    = "0.8.24"
optimizer        = true
optimizer_runs   = 200
via_ir           = true
remappings       = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
]
network = "monad"   # Foundry >=1.8: Monad execution model (opcode pricing, gas-limit billing)
# Deploy.s.sol writes contracts.json; fork tests and launch script read it.
# deployments/ is used for mainnet output (DEPLOY_OUTPUT=deployments/monad-mainnet.json).
fs_permissions = [
    { access = "read-write", path = "../../revpad-anvil/.anvil-state/" },
    { access = "read-write", path = "deployments/" },
]

[profile.default.fuzz]
runs = 10_000

[profile.default.invariant]
runs  = 500
depth = 100

[rpc_endpoints]
monad_fork = "${MONAD_RPC_URL}"
anvil      = "http://127.0.0.1:8545"
