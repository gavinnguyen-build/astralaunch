version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: revpad
      POSTGRES_PASSWORD: revpad
      POSTGRES_DB: revpad
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U revpad']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
